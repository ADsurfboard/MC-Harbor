name: Apple Silicon compatibility
on:
  push:
    branches: ["codex/apple-release", "main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test native window lifecycle
        run: python3 tools/check-window-lifecycle.py
      - name: Build test bundle
        env:
          HARBOR_TEST_WITHOUT_SFX: '1'
        run: python3 tools/build-native.py
      - name: Verify native app and retained visual assets
        run: |
          test "$(/usr/bin/lipo -archs 'build/MC Harbor.app/Contents/MacOS/MCHarbor')" = arm64
          test "$(/usr/bin/lipo -archs 'build/MC Harbor.app/Contents/Resources/Runtime/bin/java')" = arm64
          /usr/bin/codesign --verify --deep --strict 'build/MC Harbor.app'
          test -f 'build/MC Harbor.app/Contents/Resources/Contributors/jiekee.png'
          grep -q 'glassEffect(' Sources/HarborTheme.swift
      - name: Verify instance deletion and external authentication
        run: |
          python3 tools/check-instance-deletion.py
          python3 tools/check-external-login.py
      - name: Inspect Apple bundle
        env:
          HARBOR_TEST_WITHOUT_SFX: '1'
        run: python3 tools/check-apple-bundle.py
      - name: Test packaged Apple Java backend
        run: python3 tools/check-apple-backend.py
      - name: Prepare disposable test keychain
        shell: bash
        run: |
          qa_keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$qa_keychain_password"
          security create-keychain -p "$qa_keychain_password" "$RUNNER_TEMP/mcharbor-ci.keychain-db"
          security unlock-keychain -p "$qa_keychain_password" "$RUNNER_TEMP/mcharbor-ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/mcharbor-ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/mcharbor-ci.keychain-db"
      - name: Build and test native client workflows
        env:
          HARBOR_FAST_QA: '1'
          HARBOR_SKIP_LIVE_QA: '1'
        run: |
          python3 tools/build-update-checks.py
          python3 tools/run-update-checks.py
          python3 tools/check-discovery.py
          python3 tools/check-language-pipeline.py
          python3 tools/check-instance-shortcut.py
      - name: Test friends and chat services
        run: |
          mkdir -p evidence
          node social-cloud/test-worker.mjs
          python3 social-server/test_server.py
