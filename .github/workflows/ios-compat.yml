name: iOS port verification
on:
  push:
    branches: ["codex/ios-port"]
    paths: ["iOS/**", ".github/workflows/ios-compat.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device-and-core:
    # Cross-build iPhone ARM64 on Intel to avoid requesting four scarce ARM VMs.
    runs-on: macos-26-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Inspect Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test multi-touch, layouts and modpack storage boundaries
        working-directory: iOS/HarborCore
        run: swift test --jobs 3
      - name: Test production account-token storage without real Keychain access
        run: python3 iOS/tools/test-account-tokens.py
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: x64
      - name: Prepare native tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v cmake || brew install cmake
          command -v ldid || brew install ldid
      - name: Build real iPhone ARM64 app and IPA
        run: python3 iOS/tools/build-native-engine.py --platform device
      - name: Retain device package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-engine-verification-device
          path: |
            iOS/evidence/native-*.json
            iOS/build/*.ipa
            iOS/.build/engine-device/patch-proof.json
            iOS/.build/engine-device/source/Natives/build/CMakeFiles/CMakeConfigureLog.yaml
  simulator-and-ui:
    # Reuse one ARM VM for both UI and complete native-app runtime checks.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare reproducible Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          cd iOS
          xcodegen generate
      - name: Build real UIKit and SwiftUI app host
        working-directory: iOS
        run: |
          xcodebuild -project MCHarborIOS.xcodeproj -scheme HarborIOSHarness -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run actual iPhone and iPad UI tests
        working-directory: iOS
        run: python3 tools/test-simulator-ui.py
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-build-diagnostics
          path: |
            iOS/DerivedData/Logs
            iOS/evidence/ui-*.xcresult
            iOS/evidence/ui-*.json
            iOS/evidence/screenshots
      - name: Release UI-test simulators before native engine work
        run: |
          xcrun simctl list devices booted --json
          xcrun simctl shutdown all
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: aarch64
      - name: Prepare native tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v cmake || brew install cmake
          command -v ldid || brew install ldid
      - name: Build real JVM, graphics and native touch integration
        run: python3 iOS/tools/build-native-engine.py --platform simulator
      - name: Install and launch the complete native app on iPhone simulator
        run: python3 iOS/tools/smoke-native-simulator.py
      - name: Retain native engine and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-engine-verification-simulator
          path: |
            iOS/evidence/native-*.json
            iOS/evidence/native-simulator-smoke
            iOS/build/*.zip
            iOS/.build/engine-simulator/patch-proof.json
            iOS/.build/engine-simulator/source/Natives/build/CMakeFiles/CMakeConfigureLog.yaml
