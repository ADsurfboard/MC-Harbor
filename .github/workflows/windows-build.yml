name: Windows build check

on:
  pull_request:
    branches: [windows]
  push:
    branches: [windows, windows-x64-1.7.1, windows-arm64, windows-1.7.1.1]
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Windows release version and tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content SOURCE.json -Raw | ConvertFrom-Json).windows.version
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw 'Invalid Windows version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "windows-v$version") { throw 'The tag differs from SOURCE.json.' }
            git merge-base --is-ancestor HEAD origin/windows
            if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to reviewed windows history.' }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source privacy
        run: |
          python tools/test-source-privacy.py
          if ($LASTEXITCODE -ne 0) { throw 'Source privacy regression checks failed.' }
          python tools/test-windows-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging regression checks failed.' }
          python tools/test-publish-windows-assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Shared Release publishing checks failed.' }
          python tools/check-source-privacy.py
          if ($LASTEXITCODE -ne 0) { throw 'Source privacy check failed.' }
          python tools/test-windows-payload.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows payload checks failed.' }
      - name: Export corresponding committed source before generating build files
        run: python tools/package-windows-source.py --output-directory build/windows-source
      - name: Prepare WiX
        shell: pwsh
        run: |
          $env:DOTNET_ROLL_FORWARD = 'Major'
          $tool = Join-Path $env:RUNNER_TEMP 'harbor-wix'
          dotnet tool install wix --version 5.0.2 --tool-path $tool --allow-roll-forward
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          & (Join-Path $tool 'wix.exe') extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension installation failed.' }
          $tool | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check local translation transport privacy
        run: dotnet run --project tests/windows-local-transport/LocalTransportChecks.csproj -c Release
      - name: Check platform routing and native execution
        run: dotnet run --project tests/windows-platform-checks/PlatformChecks.csproj -c Release -r win-${{ matrix.architecture }} --self-contained false -- --expect-architecture ${{ matrix.architecture }}
      - name: Check emulated OPUS runtime on ARM64
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          tools/setup-windows-translation.ps1
          & 'build/translation-python/tools/python.exe' -I tools/check-windows-translation-runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'The x64 OPUS compatibility runtime failed on ARM64.' }
      - name: Build unsigned test payload without optional licensed interface sounds
        shell: pwsh
        run: |
          $architecture = '${{ matrix.architecture }}'
          tools/build-windows.ps1 -Mode Publish -Architecture $architecture
          $folder = if ($architecture -eq 'arm64') { 'build/MC-Harbor-Windows-arm64' } else { 'build/MC-Harbor-Windows' }
          tools/package-windows.ps1 -PublishDirectory $folder -Architecture $architecture -Format Installer
          python tools/check-windows-backend.py --directory $folder --architecture $architecture
          python tools/check-source-privacy.py --zip "build/MC-Harbor-Windows-$architecture-portable.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Windows payload privacy check failed.' }
          if ($architecture -eq 'x64') {
            python tools/package-windows-release.py
            if ($LASTEXITCODE -ne 0) { throw 'Release assembly failed.' }
          }
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: windows-${{ matrix.architecture }}-ci-unsigned
          compression-level: 0
          path: |
            build/MC-Harbor-Windows-${{ matrix.architecture }}-portable.zip
            build/MC-Harbor-Windows-${{ matrix.architecture }}-Setup.msi
            build/windows-source/*
            build/windows-release/*

  release:
    needs: windows
    if: github.repository == 'ADsurfboard/MC-Harbor' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-ci-unsigned
          path: release-assets
      - name: Verify and attach Windows assets to the shared Latest release
        run: python3 tools/publish-windows-assets.py --directory release-assets
