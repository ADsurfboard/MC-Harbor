name: MCHarborIOS
options:
  bundleIdPrefix: net.morben.harbor.ios
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  HarborCore:
    type: framework
    platform: iOS
    sources: [HarborCore/Sources/HarborCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.morben.harbor.ios.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
  HarborIOSUI:
    type: framework
    platform: iOS
    sources:
      - UI
      - path: ../Assets/Contributors
        buildPhase: resources
      - path: ../Assets/Loaders
        buildPhase: resources
      - path: ../Assets/Brand/Mark.png
        buildPhase: resources
      - path: ../Assets/Brand/Mark-dark.png
        buildPhase: resources
    dependencies:
      - target: HarborCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.morben.harbor.ios.ui
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        SWIFT_INSTALL_OBJC_HEADER: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
  HarborIOSHarness:
    type: application
    platform: iOS
    sources: [Harness]
    dependencies:
      - target: HarborIOSUI
      - target: HarborCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.morben.harbor.ios.qa
        PRODUCT_NAME: HarborIOSHarness
        INFOPLIST_KEY_CFBundleDisplayName: "MC Harbor QA"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  HarborIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HarborIOSHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.morben.harbor.ios.uitests
  HarborNativeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NativeUITests]
    dependencies:
      - target: HarborIOSHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.morben.harbor.ios.nativeuitests
schemes:
  HarborIOSUI:
    build:
      targets:
        HarborCore: all
        HarborIOSUI: all
  HarborIOSHarness:
    build:
      targets:
        HarborIOSHarness: all
        HarborIOSUITests: [test]
    test:
      targets: [HarborIOSUITests]
      gatherCoverageData: true
  HarborNativeRuntimeTests:
    build:
      targets:
        HarborIOSHarness: all
        HarborNativeIOSUITests: [test]
    test:
      targets: [HarborNativeIOSUITests]
